<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mi.News - WWDC26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-dark: #000000;
            --text-light: #ffffff;
            --accent-green: #3cd01e;
            --accent-blue: #2300ff;
            --card-bg: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        /* --- LOGO MI.NEWS --- */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-main {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            display: flex;
            align-items: center;
            line-height: 1;
        }

        .logo-mi {
            color: var(--text-dark);
            position: relative;
        }

        .logo-mi::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 54%;
            width: 12px;
            height: 6px;
            background-color: #f7e300;
        }

        .logo-news {
            color: var(--text-dark);
            position: relative;
            margin-left: 2px;
        }

        .logo-arrow {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 22px solid var(--accent-green);
            margin-left: 5px;
            display: inline-block;
            transform: translateY(2px);
        }

        .logo-subtitle {
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 5px;
            line-height: 1.3;
        }

        .logo-subtitle span {
            text-decoration: underline;
        }

        /* --- CARTE PRINCIPALE --- */
        .card {
            background-color: var(--card-bg);
            color: var(--text-light);
            border-radius: 60px;
            padding: 60px 40px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .wwdc-title {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wwdc-grey {
            background: linear-gradient(180deg, #555 0%, #222 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .wwdc-white {
            color: #d1d1d6;
        }

        .wwdc-glow {
            color: #ffffff;
            text-shadow: 
                0 0 10px rgba(255,255,255,0.8),
                0 0 20px rgba(255,255,255,0.4),
                0 0 30px rgba(247, 227, 0, 0.3);
            font-weight: 800;
        }

        .card-headline {
            font-size: 1.5rem;
            font-weight: 600;
            max-width: 500px;
            margin: 0 auto 15px auto;
            line-height: 1.3;
        }

        .card-details {
            font-size: 0.9rem;
            color: #a1a1a6;
            font-weight: 400;
        }

        /* --- BOUTON DE NAVIGATION --- */
        .btn-continue {
            display: inline-block;
            background-color: #ffffff;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 16px 60px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #e5e5ea;
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }

        .btn-continue span {
            color: var(--accent-blue);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .wwdc-title { font-size: 3.5rem; }
            .card-headline { font-size: 1.2rem; }
            .card { border-radius: 40px; padding: 40px 20px; }
            .btn-continue { width: 100%; padding: 16px 20px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="logo-container">
            <div class="logo-main">
                <span class="logo-mi">mi</span>
                <span class="logo-news">News</span>
                <div class="logo-arrow"></div>
            </div>
            <p class="logo-subtitle">
                L'actualité, pour vous.<br>
                <span>mini</span>, simple rapide !
            </p>
        </header>

        <main class="card">
            <h1 class="wwdc-title">
                <span class="wwdc-grey">WW</span><span class="wwdc-white">DC</span><span class="wwdc-glow">26</span>
            </h1>
            <p class="card-headline">
                Une semaine placée sous le signe de la technologie, de la créativité et de la communauté.
            </p>
            <p class="card-details">
                Du 8 au 12 juin 2026. Tout se déroule en ligne et c'est gratuit.
            </p>
        </main>

        <footer>
            <a href="#" class="btn-continue">
                Continuer <span>sur mi.News</span>
            </a>
        </footer>
    </div>

</body>
</html>
