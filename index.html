<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mi.News - Plateforme d'Actualités</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-dark: #000000;
            --text-light: #ffffff;
            --accent-green: #3cd01e;
            --accent-blue: #2300ff;
            --card-bg: #000000;
            --grey-light: #f5f5f7;
            --grey-text: #666666;
            --border-color: #e5e5ea;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
        }

        /* --- ÉCRAN DE PRÉSENTATION (WWDC) --- */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        #welcome-screen .container {
            width: 100%;
            max-width: 750px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        /* --- STRUCTURAL LOGO --- */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-main {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            display: flex;
            align-items: center;
            line-height: 1;
        }

        .logo-mi {
            color: var(--text-dark);
            position: relative;
        }

        .logo-mi::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 54%;
            width: 12px;
            height: 6px;
            background-color: #f7e300;
        }

        .logo-news {
            color: var(--text-dark);
            position: relative;
            margin-left: 2px;
        }

        .logo-arrow {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 22px solid var(--accent-green);
            margin-left: 5px;
            display: inline-block;
            transform: translateY(2px);
        }

        .logo-subtitle {
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 5px;
            line-height: 1.3;
            text-align: center;
        }

        .logo-subtitle span {
            text-decoration: underline;
        }

        /* --- CARTE INTRO --- */
        .card {
            background-color: var(--card-bg);
            color: var(--text-light);
            border-radius: 60px;
            padding: 60px 40px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .wwdc-title {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wwdc-grey {
            background: linear-gradient(180deg, #555 0%, #222 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .wwdc-white { color: #d1d1d6; }

        .wwdc-glow {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.4);
            font-weight: 800;
        }

        .card-headline {
            font-size: 1.5rem;
            font-weight: 600;
            max-width: 500px;
            margin: 0 auto 15px auto;
            line-height: 1.3;
        }

        .card-details {
            font-size: 0.9rem;
            color: #a1a1a6;
        }

        .btn-continue {
            display: inline-block;
            background-color: #ffffff;
            color: var(--text-dark);
            text-decoration: none;
